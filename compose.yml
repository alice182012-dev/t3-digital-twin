---
x-airflow-common: &airflow-common
  build:
    context: .
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@airflow-redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_TIMEOUT: ${AIRFLOW_TASK_HEARTBEAT_TIMEOUT:-1800}
    AIRFLOW__EXECUTION_API__JWT_EXPIRATION_TIME: ${AIRFLOW_EXECUTION_API_JWT_EXPIRATION_TIME:-14400}
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    MINIO_ENDPOINT: http://minio:9000
    INITIAL_WL_MINIO_BUCKET: ${INITIAL_WL_MINIO_BUCKET:-initial-wl}
    INITIAL_WL_MINIO_PREFIX: ${INITIAL_WL_MINIO_PREFIX:-dummy-files}
    MANHOLES_MINIO_BUCKET: ${MANHOLES_MINIO_BUCKET:-manholes-data}
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    AIRFLOW__CELERY__WORKER_CONCURRENCY: ${AIRFLOW_WORKER_CONCURRENCY:-1}
    MAX_WORKERS: ${MAX_WORKERS:-1}
    SAMPLE_RATE: ${SAMPLE_RATE:-1}
    MIN_DEPTH_THRESHOLD: ${MIN_DEPTH_THRESHOLD:-0}
    FLOOD_USE_DOWNLOADED_RESULTS: ${FLOOD_USE_DOWNLOADED_RESULTS:-false}
    LOCAL_GEOJSON_DIR: ${LOCAL_GEOJSON_DIR:-/opt/airflow/data/mapping/output_road_geojson}
    KEEP_LOCAL_GEOJSON: ${KEEP_LOCAL_GEOJSON:-false}
    FLOOD_EXTENT_WORKERS: ${FLOOD_EXTENT_WORKERS:-2}
    FLOOD_EXTENT_KEEP_RUNS: ${FLOOD_EXTENT_KEEP_RUNS:-8}
    ARCHIVE_MIN_FREE_GB: ${ARCHIVE_MIN_FREE_GB:-50}
    EDGE_TABLE_KEEP_RUNS: ${EDGE_TABLE_KEEP_RUNS:-8}
    EDGE_DEPTH_KEEP_HOURS: ${EDGE_DEPTH_KEEP_HOURS:-24}
    FLOOD_EXTENT_TILE_STEPS: ${FLOOD_EXTENT_TILE_STEPS:-2}
    FLOOD_TILES_INPUT: ${FLOOD_TILES_INPUT:-files}
    FLOOD_COLD_START_AFTER_BREAK: ${FLOOD_COLD_START_AFTER_BREAK:-1}
    FLOOD_EXTENT_BUCKET: ${FLOOD_EXTENT_BUCKET:-flood-extent}
    SIMULATION_DURATION: ${SIMULATION_DURATION:-7200}
    UPDATE_INTERVAL: ${UPDATE_INTERVAL:-900}
    FLOOD_TEST_RAIN_MM_HR: ${FLOOD_TEST_RAIN_MM_HR:-}
    FLOOD_TEST_RAIN_CSV: ${FLOOD_TEST_RAIN_CSV:-}
    FLOOD_TEST_RAIN_START: ${FLOOD_TEST_RAIN_START:-}
    FLOOD_RAIN_THRESHOLD_MM_HR: ${FLOOD_RAIN_THRESHOLD_MM_HR:-5}
    FLOOD_RAIN_LOOKAHEAD_HOURS: ${FLOOD_RAIN_LOOKAHEAD_HOURS:-2}
    FLOOD_RAIN_TIMESTEP_MINUTES: ${FLOOD_RAIN_TIMESTEP_MINUTES:-15}
    TOMORROW_API_KEY: ${TOMORROW_API_KEY:?Set TOMORROW_API_KEY in .env}
    THREEDI_API_KEY: ${THREEDI_API_KEY:?Set THREEDI_API_KEY in .env}
    THREEDI_API_HOST: ${THREEDI_API_HOST:-https://api.3di.live}
    THREEDI_API_PERSONAL_API_TOKEN: ${THREEDI_API_PERSONAL_API_TOKEN:-}
    MODEL_ID: ${MODEL_ID:-83022}
    ORG_UUID: ${ORG_UUID:?Set ORG_UUID in .env}
  volumes:
    - ./dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./plugins:/opt/airflow/plugins
    - ./scripts:/opt/airflow/scripts
    - ${DATA_HOST_PATH:-./data}:/opt/airflow/data
    # US-094: results_3di.nc and a run record of every real-rain run. On the server this is D:\airflow_new_data\archive.
    - ${ARCHIVE_HOST_PATH:-./archive}:/opt/airflow/archive
    # The edge depth tables (US-041, US-042). The worker writes, and the routing readers mount this volume read-only.
    # A named volume, not a folder under DATA_HOST_PATH: replacing the `latest` pointer is a rename, and the rename
    # semantics of the Docker VM's own disk are the ones the readers can count on. See
    # artifacts/docs/claude-plan/edge-depth-table-publish.md, decision 1.
    - edge-depth-tables:/opt/airflow/edge_depth_tables
    # scripts/flood_metrics/extract_run.py imports flood_utils.py for per-vehicle impassable
    # depths (FLOOD_UTILS_DIR). Mount only this folder, read-only, not all of ./floodmap: it has
    # no import dependency on the rest of that tree (checked: stdlib only).
    - ./floodmap/graphhopper-flood-road/scripts:/opt/airflow/floodmap/graphhopper-flood-road/scripts:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    airflow-redis:
      condition: service_healthy
    airflow-postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  minio:
    # Pulled from quay.io, not Docker Hub: MinIO restricted anonymous Docker Hub
    # pulls of minio/minio as part of their 2024 licensing change, so
    # docker.io/minio/minio now returns a misleading "pull access denied" even
    # though the image itself hasn't moved off Docker Hub for existing pulls.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    # Both quay.io/minio/mc and docker.io/minio/mc now deny anonymous pulls (checked
    # 2026-10-02: quay.io's anonymous token grants no pull action, Docker Hub says the repo
    # "does not exist"), and dl.min.io returns 410 Gone for the mc binary: MinIO archived the
    # open-source mc/server/KES projects and stopped serving them from every official
    # channel. The GitHub release for this same version still hosts the binary as an asset
    # (GitHub doesn't retroactively delete release assets), so we fetch from there instead
    # and verify against MinIO's own published sha256sum for that asset.
    image: alpine:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      INITIAL_WL_MINIO_BUCKET: ${INITIAL_WL_MINIO_BUCKET:-initial-wl}
      MANHOLES_MINIO_BUCKET: ${MANHOLES_MINIO_BUCKET:-manholes-data}
      FLOOD_EXTENT_BUCKET: ${FLOOD_EXTENT_BUCKET:-flood-extent}
    entrypoint:
      - /bin/sh
      - -c
      - |
        wget -qO /usr/local/bin/mc https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z
        echo "01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891  /usr/local/bin/mc" | sha256sum -c -
        chmod +x /usr/local/bin/mc
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          echo "Waiting for MinIO..."
          sleep 2
        done
        mc mb --ignore-existing "local/$${INITIAL_WL_MINIO_BUCKET}"
        mc mb --ignore-existing "local/$${MANHOLES_MINIO_BUCKET}"
        mc mb --ignore-existing "local/$${FLOOD_EXTENT_BUCKET}"
        # Only this bucket serves tiles straight to the browser (via nginx), so only this one
        # gets anonymous read. The MinIO API port itself stays bound to 127.0.0.1 (see the
        # `minio` service's `ports:`), so this bucket is public only through nginx's proxy.
        mc anonymous set download "local/$${FLOOD_EXTENT_BUCKET}"
        echo "MinIO buckets ready: $${INITIAL_WL_MINIO_BUCKET}, $${MANHOLES_MINIO_BUCKET}, $${FLOOD_EXTENT_BUCKET}"

  storage-postgres:
    # The official postgis/postgis:17-3.5 tag is amd64-only (no arm64 manifest as of
    # this writing). imresamu/postgis is a multi-arch mirror built from the same
    # Dockerfile/version, published specifically to cover arm64 (Apple Silicon, etc).
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minio_custom}
      POSTGRES_USER: ${POSTGRES_USER:-minio_custom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - storage-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  timescaledb:
    # Docker Hub only: Timescale publishes no quay.io, GHCR, or public ECR mirror.
    # The quay.io move in 4c39adb was specific to MinIO's restricted Docker Hub pulls.
    image: timescale/timescaledb:2.30.1-pg17
    environment:
      POSTGRES_DB: ${TIMESCALE_DB:-flood_metrics}
      POSTGRES_USER: ${TIMESCALE_USER:-flood_metrics}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:?Set TIMESCALE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${TIMESCALE_HOST_PORT:-5434}:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  storage-backend:
    build:
      context: ./minio_custom/backend
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - ${GUNICORN_WORKERS:-2}
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,storage-backend}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DJANGO_USE_X_FORWARDED_HOST: ${DJANGO_USE_X_FORWARDED_HOST:-true}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-minio_custom}
      DB_USER: ${POSTGRES_USER:-minio_custom}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_HOST: storage-postgres
      DB_PORT: 5432
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-720}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-14}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:${MINIO_API_PORT:-9000}}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_SECURE: "false"
    depends_on:
      minio:
        condition: service_started
      storage-postgres:
        condition: service_healthy
    ports:
      - "${STORAGE_BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  storage-frontend:
    build:
      context: ./minio_custom/frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    depends_on:
      - storage-backend
    ports:
      - "${STORAGE_FRONTEND_PORT:-5173}:80"
    restart: unless-stopped

  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-redis:
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: unless-stopped

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          export AIRFLOW_UID=$$(id -u)
        fi
        mkdir -v -p /opt/airflow/{logs,dags,scripts,plugins,config}
        /entrypoint airflow version
        mkdir -v -p /opt/airflow/{data,state,edge_depth_tables}
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,scripts,plugins,config,data,state,edge_depth_tables}
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  airflow-trigger-flood-mapping:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        /entrypoint airflow dags unpause flood_mapping_full || true
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-scheduler:
        condition: service_started
      airflow-worker:
        condition: service_started
    restart: "no"

  graphhopper:
    # The time-aware image (java/time-aware-routing, US-049 and US-052): the stock image below, pinned by digest in that
    # folder's Dockerfile (ARG STOCK_IMAGE, keep the digest the same), with the module's jar first on the classpath. This
    # is a 12.0-SNAPSHOT build and the `ch.disable`-in-body behaviour Workstream B depends on is undocumented and
    # could silently change. Re-pull the digest deliberately if upstream publishes a fix, and re-run the ch.disable
    # smoke test before trusting it. Build it on the host that runs it: `docker compose build graphhopper` from the
    # repo folder on the server (bind mounts and build contexts resolve on the client).
    # Roll back to the stock image by replacing `build` and `image` with
    #   image: israelhikingmap/graphhopper@sha256:3e79eb33862028cfc58f9d6c162630b68638d6aad790b5a698c854dbbaa7fe32
    # and restoring the entrypoint line below, and set TIME_AWARE_ROUTING=false.
    build:
      context: ./java/time-aware-routing
    image: graphhopper-time-aware:local
    volumes:
      - ../grasshopper-routing/osm/hanoi-model-area.osm.pbf:/data/hanoi-model-area.osm.pbf:ro
      - graphhopper-graph-cache:/data/graph-cache
      # The edge depth tables, read-only. The engine follows `latest` here (time_aware.table_dir in config.yml).
      - edge-depth-tables:/tables:ro
      - ./floodmap/graphhopper-flood-road/graphhopper/config.yml:/graphhopper/config.yml:ro
      - ./floodmap/graphhopper-flood-road/graphhopper/motorbike.json:/graphhopper/motorbike.json:ro
      - ./floodmap/graphhopper-flood-road/graphhopper/car_custom.json:/graphhopper/car_custom.json:ro
      - ./floodmap/graphhopper-flood-road/graphhopper/truck_custom.json:/graphhopper/truck_custom.json:ro
      - ./floodmap/graphhopper-flood-road/graphhopper/foot_custom.json:/graphhopper/foot_custom.json:ro
      - ./floodmap/graphhopper-flood-road/graphhopper/foot_avoid_private_node_custom.json:/graphhopper/foot_avoid_private_node_custom.json:ro
    # -o pins the graph-cache output dir. Without it, this build's graphhopper.sh
    # defaults GRAPH to /data/default-gh and passes it as a -D system property
    # that overrides config.yml's graph.location, so the app silently loads
    # whatever graph is baked into the image instead of importing the mounted
    # OSM extract into the graphhopper-graph-cache volume. See
    # artifacts/docs/blockers/graphhopper-vehicle-profile-rejection.md.
    # The image's entrypoint (run-time-aware.sh) takes the same -c and -o options as graphhopper.sh.
    command: ["-c", "config.yml", "-o", "/data/graph-cache"]
    ports:
      - "${GRAPHHOPPER_PORT:-8989}:8989"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8989/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  floodmap-backend:
    build:
      context: ./floodmap/graphhopper-flood-road
      dockerfile: backend/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8010
      GRAPHHOPPER_URL: http://graphhopper:8989
      POSTGRES_HOST: storage-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-minio_custom}
      # US-072. The backend connects as the read-only role that scripts/database/create_routing_reader_role.py makes,
      # never as the writer. Compose refuses to start without the reader's password instead of falling back.
      POSTGRES_USER: ${ROUTING_READER_USER:-routing_reader}
      POSTGRES_PASSWORD: ${ROUTING_READER_PASSWORD:?Set ROUTING_READER_PASSWORD in .env}
      PHOTON_BASE_URL: ${PHOTON_BASE_URL:-https://photon.komoot.io}
      # US-052. On: POST /route goes to the time-aware engine first and falls back to today's request when the engine
      # cannot run (missing, stale, or mismatched table), and the response says so. Off: today's behavior exactly.
      TIME_AWARE_ROUTING: ${TIME_AWARE_ROUTING:-false}
      # US-053. POST /route/departures reads the newest depth table from this folder, the volume below, read-only.
      EDGE_TABLE_DIR: /tables
    depends_on:
      graphhopper:
        condition: service_healthy
      storage-postgres:
        condition: service_healthy
    volumes:
      - edge-depth-tables:/tables:ro
    ports:
      - "${FLOODMAP_BACKEND_PORT:-8010}:8010"
    restart: unless-stopped

  analysis:
    # US-109. Its own image and requirements file. No env_file and no x-airflow-common: the environment holds only
    # the service's own credentials, so the 3Di, Tomorrow.io, and MinIO keys never reach it.
    # test/test_analysis_service_compose.py checks the variable list.
    build:
      context: ./analysis-service
    environment:
      HOST: 0.0.0.0
      PORT: 8020
      POSTGRES_HOST: storage-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-minio_custom}
      # Reads flood results (US-107). scripts/database/create_routing_reader_role.py analysis_reader makes the role.
      ANALYSIS_READER_USER: ${ANALYSIS_READER_USER:-analysis_reader}
      ANALYSIS_READER_PASSWORD: ${ANALYSIS_READER_PASSWORD:?Set ANALYSIS_READER_PASSWORD in .env}
      # Owns schema analysis, the only place the service writes. scripts/database/create_analysis_schema.py.
      ANALYSIS_OWNER_USER: ${ANALYSIS_OWNER_USER:-analysis_owner}
      ANALYSIS_OWNER_PASSWORD: ${ANALYSIS_OWNER_PASSWORD:?Set ANALYSIS_OWNER_PASSWORD in .env}
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: ${TIMESCALE_DB:-flood_metrics}
      # Reads depth_history and history_moment. scripts/database/create_timescale_reader_role.py.
      ANALYSIS_TIMESCALE_READER_USER: ${ANALYSIS_TIMESCALE_READER_USER:-analysis_timescale_reader}
      ANALYSIS_TIMESCALE_READER_PASSWORD: ${ANALYSIS_TIMESCALE_READER_PASSWORD:?Set ANALYSIS_TIMESCALE_READER_PASSWORD in .env}
    depends_on:
      storage-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ANALYSIS_PORT:-8020}:8020"
    restart: unless-stopped

  # floodmap-frontend (Valhalla-era static test UI, floodmap/valhalla-flood-road-test/frontend)
  # is retired here: floodmap-backend's response contract changed from Valhalla's
  # trip/legs/polyline shape to GraphHopper's paths[] shape (Workstream B), so the old
  # UI no longer matches it. Superseded by flood-routing-frontend (Workstream C) below.
  # The Valhalla PoC source tree is left on disk, untouched, for reference.

  flood-routing-frontend:
    build:
      context: ./floodmap/graphhopper-maps
    depends_on:
      - floodmap-backend
    # Vector tiles of the flood extent live in MinIO now (scripts/flood_extent/publish.py), not
    # a bind-mounted folder — the Airflow worker and this frontend run on separate hosts in
    # production, so a bind mount can't carry files between them. nginx.conf proxies
    # /flood-extent/ to the `minio` service's flood-extent bucket instead of serving a local
    # folder (nginx.conf can't read compose env vars — the bucket name there must be kept in
    # sync with FLOOD_EXTENT_BUCKET's default below if that default ever changes).
    ports:
      - "${FLOOD_ROUTING_FRONTEND_PORT:-8082}:80"
    restart: unless-stopped

volumes:
  graphhopper-graph-cache:
  edge-depth-tables:
  airflow-postgres-data:
  # Backed by a host path instead of Docker's default storage location so task logs land on
  # AIRFLOW_LOGS_HOST_PATH (see .env.example) instead of the SSD-backed Docker data disk.
  airflow-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${AIRFLOW_LOGS_HOST_PATH:-./.docker-volumes/airflow-logs}
  minio-data:
  storage-postgres-data:
  timescaledb-data:
