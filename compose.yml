---
x-airflow-common: &airflow-common
  build:
    context: .
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@airflow-redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_TIMEOUT: ${AIRFLOW_TASK_HEARTBEAT_TIMEOUT:-1800}
    AIRFLOW__EXECUTION_API__JWT_EXPIRATION_TIME: ${AIRFLOW_EXECUTION_API_JWT_EXPIRATION_TIME:-14400}
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    MINIO_ENDPOINT: http://minio:9000
    FLOOD_MINIO_BUCKET: ${FLOOD_MINIO_BUCKET:-flood-results-full}
    INITIAL_WL_MINIO_BUCKET: ${INITIAL_WL_MINIO_BUCKET:-initial-wl}
    INITIAL_WL_MINIO_PREFIX: ${INITIAL_WL_MINIO_PREFIX:-dummy-files}
    MANHOLES_MINIO_BUCKET: ${MANHOLES_MINIO_BUCKET:-manholes-data}
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    AIRFLOW__CELERY__WORKER_CONCURRENCY: ${AIRFLOW_WORKER_CONCURRENCY:-1}
    MAX_WORKERS: ${MAX_WORKERS:-1}
    SAMPLE_RATE: ${SAMPLE_RATE:-1}
    MIN_DEPTH_THRESHOLD: ${MIN_DEPTH_THRESHOLD:-0}
    FLOOD_USE_DOWNLOADED_RESULTS: ${FLOOD_USE_DOWNLOADED_RESULTS:-false}
    LOCAL_GEOJSON_DIR: ${LOCAL_GEOJSON_DIR:-/opt/airflow/data/mapping/output_road_geojson}
    KEEP_LOCAL_GEOJSON: ${KEEP_LOCAL_GEOJSON:-false}
    FLOOD_EXTENT_WORKERS: ${FLOOD_EXTENT_WORKERS:-2}
    FLOOD_EXTENT_KEEP_RUNS: ${FLOOD_EXTENT_KEEP_RUNS:-3}
    FLOOD_EXTENT_BUCKET: ${FLOOD_EXTENT_BUCKET:-flood-extent}
    SIMULATION_DURATION: ${SIMULATION_DURATION:-7200}
    UPDATE_INTERVAL: ${UPDATE_INTERVAL:-900}
    FLOOD_TEST_RAIN_MM_HR: ${FLOOD_TEST_RAIN_MM_HR:-}
    FLOOD_RAIN_THRESHOLD_MM_HR: ${FLOOD_RAIN_THRESHOLD_MM_HR:-5}
    FLOOD_RAIN_LOOKAHEAD_HOURS: ${FLOOD_RAIN_LOOKAHEAD_HOURS:-2}
    FLOOD_RAIN_TIMESTEP_MINUTES: ${FLOOD_RAIN_TIMESTEP_MINUTES:-15}
    FLOOD_RAIN_CHECK_INTERVAL_SECONDS: ${FLOOD_RAIN_CHECK_INTERVAL_SECONDS:-900}
    TOMORROW_API_KEY: ${TOMORROW_API_KEY:?Set TOMORROW_API_KEY in .env}
    THREEDI_API_KEY: ${THREEDI_API_KEY:?Set THREEDI_API_KEY in .env}
    THREEDI_API_HOST: ${THREEDI_API_HOST:-https://api.3di.live}
    THREEDI_API_PERSONAL_API_TOKEN: ${THREEDI_API_PERSONAL_API_TOKEN:-}
    MODEL_ID: ${MODEL_ID:-83022}
    ORG_UUID: ${ORG_UUID:?Set ORG_UUID in .env}
  volumes:
    - ./dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./plugins:/opt/airflow/plugins
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    airflow-redis:
      condition: service_healthy
    airflow-postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  minio:
    # Pulled from quay.io, not Docker Hub: MinIO restricted anonymous Docker Hub
    # pulls of minio/minio as part of their 2024 licensing change, so
    # docker.io/minio/minio now returns a misleading "pull access denied" even
    # though the image itself hasn't moved off Docker Hub for existing pulls.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    # See the minio service's image comment: pulled from quay.io for the same reason.
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      FLOOD_MINIO_BUCKET: ${FLOOD_MINIO_BUCKET:-flood-results-full}
      INITIAL_WL_MINIO_BUCKET: ${INITIAL_WL_MINIO_BUCKET:-initial-wl}
      MANHOLES_MINIO_BUCKET: ${MANHOLES_MINIO_BUCKET:-manholes-data}
      FLOOD_EXTENT_BUCKET: ${FLOOD_EXTENT_BUCKET:-flood-extent}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          echo "Waiting for MinIO..."
          sleep 2
        done
        mc mb --ignore-existing "local/$${FLOOD_MINIO_BUCKET}"
        mc mb --ignore-existing "local/$${INITIAL_WL_MINIO_BUCKET}"
        mc mb --ignore-existing "local/$${MANHOLES_MINIO_BUCKET}"
        mc mb --ignore-existing "local/$${FLOOD_EXTENT_BUCKET}"
        # Only this bucket serves tiles straight to the browser (via nginx), so only this one
        # gets anonymous read. The MinIO API port itself stays bound to 127.0.0.1 (see the
        # `minio` service's `ports:`), so this bucket is public only through nginx's proxy.
        mc anonymous set download "local/$${FLOOD_EXTENT_BUCKET}"
        echo "MinIO buckets ready: $${FLOOD_MINIO_BUCKET}, $${INITIAL_WL_MINIO_BUCKET}, $${MANHOLES_MINIO_BUCKET}, $${FLOOD_EXTENT_BUCKET}"

  storage-postgres:
    # The official postgis/postgis:17-3.5 tag is amd64-only (no arm64 manifest as of
    # this writing). imresamu/postgis is a multi-arch mirror built from the same
    # Dockerfile/version, published specifically to cover arm64 (Apple Silicon, etc).
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minio_custom}
      POSTGRES_USER: ${POSTGRES_USER:-minio_custom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - storage-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  timescaledb:
    # Docker Hub only: Timescale publishes no quay.io, GHCR, or public ECR mirror.
    # The quay.io move in 4c39adb was specific to MinIO's restricted Docker Hub pulls.
    image: timescale/timescaledb:2.30.1-pg17
    environment:
      POSTGRES_DB: ${TIMESCALE_DB:-flood_metrics}
      POSTGRES_USER: ${TIMESCALE_USER:-flood_metrics}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:?Set TIMESCALE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${TIMESCALE_HOST_PORT:-5434}:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  storage-backend:
    build:
      context: ./minio_custom/backend
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - ${GUNICORN_WORKERS:-2}
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,storage-backend}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DJANGO_USE_X_FORWARDED_HOST: ${DJANGO_USE_X_FORWARDED_HOST:-true}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-minio_custom}
      DB_USER: ${POSTGRES_USER:-minio_custom}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_HOST: storage-postgres
      DB_PORT: 5432
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-720}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-14}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:${MINIO_API_PORT:-9000}}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_SECURE: "false"
    depends_on:
      minio:
        condition: service_started
      storage-postgres:
        condition: service_healthy
    ports:
      - "${STORAGE_BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  storage-frontend:
    build:
      context: ./minio_custom/frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    depends_on:
      - storage-backend
    ports:
      - "${STORAGE_FRONTEND_PORT:-5173}:80"
    restart: unless-stopped

  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-redis:
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: unless-stopped

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          export AIRFLOW_UID=$$(id -u)
        fi
        mkdir -v -p /opt/airflow/{logs,dags,scripts,plugins,config}
        /entrypoint airflow version
        mkdir -v -p /opt/airflow/{data,state}
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,scripts,plugins,config,data,state}
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  airflow-trigger-flood-mapping:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        /entrypoint airflow dags unpause flood_mapping_full || true
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-scheduler:
        condition: service_started
      airflow-worker:
        condition: service_started
    restart: "no"

  graphhopper:
    # Pinned by digest, not :latest — this is a 12.0-SNAPSHOT build and the
    # `ch.disable`-in-body behaviour Workstream B depends on is undocumented
    # and could silently change. Re-pull the digest deliberately if upstream
    # publishes a fix, and re-run the ch.disable smoke test before trusting it.
    image: israelhikingmap/graphhopper@sha256:3e79eb33862028cfc58f9d6c162630b68638d6aad790b5a698c854dbbaa7fe32
    volumes:
      - ../grasshopper-routing/osm/hanoi-model-area.osm.pbf:/data/hanoi-model-area.osm.pbf:ro
      - graphhopper-graph-cache:/data/graph-cache
      - ./floodmap/graphhopper-flood-road/graphhopper/config.yml:/graphhopper/config.yml:ro
      - ./floodmap/graphhopper-flood-road/graphhopper/motorbike.json:/graphhopper/motorbike.json:ro
      - ./floodmap/graphhopper-flood-road/graphhopper/car_custom.json:/graphhopper/car_custom.json:ro
      - ./floodmap/graphhopper-flood-road/graphhopper/truck_custom.json:/graphhopper/truck_custom.json:ro
      - ./floodmap/graphhopper-flood-road/graphhopper/foot_custom.json:/graphhopper/foot_custom.json:ro
      - ./floodmap/graphhopper-flood-road/graphhopper/foot_avoid_private_node_custom.json:/graphhopper/foot_avoid_private_node_custom.json:ro
    # -o pins the graph-cache output dir. Without it, this build's graphhopper.sh
    # defaults GRAPH to /data/default-gh and passes it as a -D system property
    # that overrides config.yml's graph.location, so the app silently loads
    # whatever graph is baked into the image instead of importing the mounted
    # OSM extract into the graphhopper-graph-cache volume. See
    # artifacts/docs/blockers/graphhopper-vehicle-profile-rejection.md.
    entrypoint: ["./graphhopper.sh", "-c", "config.yml", "-o", "/data/graph-cache"]
    ports:
      - "${GRAPHHOPPER_PORT:-8989}:8989"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8989/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  floodmap-backend:
    build:
      context: ./floodmap/graphhopper-flood-road
      dockerfile: backend/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8010
      GRAPHHOPPER_URL: http://graphhopper:8989
      POSTGRES_HOST: storage-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-minio_custom}
      POSTGRES_USER: ${POSTGRES_USER:-minio_custom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PHOTON_BASE_URL: ${PHOTON_BASE_URL:-https://photon.komoot.io}
    depends_on:
      graphhopper:
        condition: service_healthy
      storage-postgres:
        condition: service_healthy
    ports:
      - "${FLOODMAP_BACKEND_PORT:-8010}:8010"
    restart: unless-stopped

  # floodmap-frontend (Valhalla-era static test UI, floodmap/valhalla-flood-road-test/frontend)
  # is retired here: floodmap-backend's response contract changed from Valhalla's
  # trip/legs/polyline shape to GraphHopper's paths[] shape (Workstream B), so the old
  # UI no longer matches it. Superseded by flood-routing-frontend (Workstream C) below.
  # The Valhalla PoC source tree is left on disk, untouched, for reference.

  flood-routing-frontend:
    build:
      context: ./floodmap/graphhopper-maps
    depends_on:
      - floodmap-backend
    # Vector tiles of the flood extent live in MinIO now (scripts/flood_extent/publish.py), not
    # a bind-mounted folder — the Airflow worker and this frontend run on separate hosts in
    # production, so a bind mount can't carry files between them. nginx.conf proxies
    # /flood-extent/ to the `minio` service's flood-extent bucket instead of serving a local
    # folder (nginx.conf can't read compose env vars — the bucket name there must be kept in
    # sync with FLOOD_EXTENT_BUCKET's default below if that default ever changes).
    ports:
      - "${FLOOD_ROUTING_FRONTEND_PORT:-8082}:80"
    restart: unless-stopped

volumes:
  graphhopper-graph-cache:
  airflow-postgres-data:
  airflow-logs:
  minio-data:
  storage-postgres-data:
  timescaledb-data:
