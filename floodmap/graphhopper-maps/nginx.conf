server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Tiles live in MinIO's flood-extent bucket now (scripts/flood_extent/publish.py), not a local
  # folder — the Airflow worker and this frontend run on separate hosts in production, so a bind
  # mount can't carry files between them. A tile that was never cut 404s (MinIO's own response
  # for a missing key), not the SPA's index.html, so the map treats it as empty. The bucket name
  # in the rewrite must match FLOOD_EXTENT_BUCKET's default (compose.yml); nginx.conf can't read
  # compose env vars.
  location /flood-extent/ {
    set $backend_host minio;
    rewrite ^/flood-extent/(.*)$ /flood-extent/runs/$1 break;
    proxy_pass http://$backend_host:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 10s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
  }

  # graphhopper-maps' config-local.js points routingApi/geocodingApi and
  # FloodStore's floodBackend all at /api/gh/ — one backend, one proxy block.
  # /route, /flood/*, /geocode, /places/search all live on floodmap-backend:8010.
  location /api/gh/ {
    set $backend_host floodmap-backend;
    rewrite ^/api/gh/(.*)$ /$1 break;
    proxy_pass http://$backend_host:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location /api/geocode/ {
    set $backend_host floodmap-backend;
    rewrite ^/api/geocode/(.*)$ /$1 break;
    proxy_pass http://$backend_host:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 10s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
  }
}
