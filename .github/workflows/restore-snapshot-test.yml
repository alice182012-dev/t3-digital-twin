name: restore-snapshot-test

on:
  push:
    paths:
      - "scripts/testdata/**"
      - "scripts/database/create_*.py"
      - "scripts/database/db_config.py"
      - ".github/workflows/restore-snapshot-test.yml"
  pull_request:
    paths:
      - "scripts/testdata/**"
      - "scripts/database/create_*.py"
      - "scripts/database/db_config.py"
      - ".github/workflows/restore-snapshot-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: floodtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install psycopg2-binary

      # unittest skips the database tests when the DSN is unset, and a skip passes; fail on it.
      - name: Run the tests
        env:
          RESTORE_TEST_DSN: postgresql://postgres:test@127.0.0.1:5432/floodtest
          POSTGRES_PASSWORD: test
        run: |
          python3 scripts/testdata/test_restore_snapshot.py 2>&1 | tee "$RUNNER_TEMP/out.txt"
          if grep -q "skipped" "$RUNNER_TEMP/out.txt"; then echo "tests skipped" >&2; exit 1; fi
