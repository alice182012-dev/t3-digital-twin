name: java-module

on:
  push:
    paths:
      - "java/time-aware-routing/**"
      - ".github/workflows/java-module.yml"
  pull_request:
    paths:
      - "java/time-aware-routing/**"
      - ".github/workflows/java-module.yml"
  workflow_dispatch:

env:
  # The commit the stock image's jar was built from (artifacts/docs/blockers/routing-not-time-aware.md).
  GRAPHHOPPER_COMMIT: d7dc1b069d2d091c7cfdc007d99d1765c82e618d

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: java/time-aware-routing/pom.xml

      # 12.0-SNAPSHOT is not on Maven Central, so build the pinned commit and install it into ~/.m2.
      - name: Cache the pinned GraphHopper build
        id: graphhopper-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/graphhopper
          key: graphhopper-${{ env.GRAPHHOPPER_COMMIT }}

      - name: Build the pinned GraphHopper
        if: steps.graphhopper-cache.outputs.cache-hit != 'true'
        run: |
          git init "$RUNNER_TEMP/graphhopper"
          git -C "$RUNNER_TEMP/graphhopper" fetch --depth 1 https://github.com/graphhopper/graphhopper.git "$GRAPHHOPPER_COMMIT"
          git -C "$RUNNER_TEMP/graphhopper" checkout FETCH_HEAD
          mvn -B -q -f "$RUNNER_TEMP/graphhopper/pom.xml" -DskipTests -Dmaven.javadoc.skip=true install -pl core,web-api,web-bundle,web -am

      - name: Test the module
        run: mvn -B -f java/time-aware-routing/pom.xml test
